services:
  dockerwatcher:
    build: .
    image: docker-watcher:local
    container_name: dockerwatcher
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8000}:${WEB_PORT:-8000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockerwatcher_data:/data

volumes:
  dockerwatcher_data:
