<div class="modal" id="options">
    <form class="modal-panel" method="post" action="{{ url_for('save_monitoring_options') }}">
        <div class="modal-header">
            <h2 class="modal-title">Monitoring options</h2>
            <a class="button" href="{{ current_path }}">Close</a>
        </div>
        <div class="options-grid">
            {% for action in actions %}
                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        name="actions"
                        value="{{ action.value }}"
                        {% if action in monitored_actions %}checked{% endif %}
                    >
                    {{ action.value.replace("_", " ") }}
                </label>
            {% endfor %}
            <label class="checkbox-label">
                <input
                    type="checkbox"
                    name="receive_daily_status"
                    {% if telegram_options.receive_daily_status %}checked{% endif %}
                >
                Receive daily status
            </label>
            <label>
                Status time
                <input
                    type="time"
                    name="daily_status_time"
                    value="{{ telegram_options.daily_status_time }}"
                >
            </label>
            <label class="checkbox-label">
                <input
                    type="checkbox"
                    name="receive_event_notifications"
                    {% if telegram_options.receive_event_notifications %}checked{% endif %}
                >
                Receive event notifications
            </label>
        </div>
        <div class="modal-footer">
            <input
                type="hidden"
                name="redirect_to"
                value="{{ current_path }}"
            >
            <a class="button" href="{{ current_path }}">Cancel</a>
            <button class="primary" type="submit">Save</button>
        </div>
    </form>
</div>
